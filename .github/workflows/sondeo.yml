name: Sondeo de fuentes
on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe.sh']
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe.sh
      - run: |
          git config user.name "eskubat-bot"
          git config user.email "eskubat.app@gmail.com"
          git add muestras
          git commit -m "Muestras de fuentes" || true
          git push
