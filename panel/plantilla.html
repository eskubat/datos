<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eskubat — Revisión de ayudas</title>
<!-- Plantilla de la página «Eskubat — Revisión de ayudas» (artefacto de Claude). No editar panel/index.html: se genera con node scripts/panel.js -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* Colores y tipografías de la marca Eskubat (prototipo de la app). Layout: bandeja a la izquierda, mesa de trabajo a la derecha */
  --bg:#F6F7F5; --panel:#FFFFFF; --ink:#14211C; --muted:#4E5D56; --line:#DDE3DF;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#E3F1EC; --accent-d:#09493F;
  --or:#B4501A; --or-soft:#FCEBDD; --or-d:#6E2E0B;
  --ok:#0E6B5C; --ok-soft:#E3F1EC; --warn:#4A3A0B; --warn-soft:#F5EDD3; --crit:#8F3D10; --crit-soft:#FCEBDD; --info:#1D3A57; --info-soft:#EAF0F6;
  --display:"Schibsted Grotesk",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --panel:#16211D; --ink:#E6EEEA; --muted:#9DB0A7; --line:#2A3833;
    --accent:#4FB8A2; --accent-ink:#06201A; --accent-soft:#163A32; --accent-d:#8BD6C5;
    --or:#F08A4B; --or-soft:#3B2214; --or-d:#F7B48A;
    --ok:#4FB8A2; --ok-soft:#163A32; --warn:#E6C873; --warn-soft:#352C12; --crit:#F7A06B; --crit-soft:#3B2214; --info:#9CBDE3; --info-soft:#1A2B3E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1714; --panel:#16211D; --ink:#E6EEEA; --muted:#9DB0A7; --line:#2A3833;
    --accent:#4FB8A2; --accent-ink:#06201A; --accent-soft:#163A32; --accent-d:#8BD6C5;
    --or:#F08A4B; --or-soft:#3B2214; --or-d:#F7B48A;
    --ok:#4FB8A2; --ok-soft:#163A32; --warn:#E6C873; --warn-soft:#352C12; --crit:#F7A06B; --crit-soft:#3B2214; --info:#9CBDE3; --info-soft:#1A2B3E;
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:800 21px/1.1 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
header h1 span{color:var(--accent)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:pointer}
.count b{font:600 16px var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.count[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:minmax(280px,380px) 1fr;min-height:0}
#lista{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.buscar{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.buscar input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#items{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:4px 1fr;gap:0 12px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .stripe{border-radius:0 3px 3px 0}
.item .t{font-weight:600;font-size:14px;line-height:1.3}
.item .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.abierta{background:var(--or-soft);border-color:transparent;color:var(--or-d)}
.chip.lista{background:var(--info-soft);border-color:transparent;color:var(--info)}
.chip.aplicada{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.descartada{color:var(--muted)}
.chip.urge{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.st-abierta{background:var(--or)} .st-lista{background:var(--info)} .st-aplicada{background:var(--ok)} .st-descartada{background:var(--line)}
#detalle{overflow:auto;min-height:0}
.wrap{max-width:860px;margin:0 auto;padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px}
.volver{display:none}
.cab h2{font:700 25px/1.2 var(--display);letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);align-items:center}
.meta code{font:12.5px var(--mono)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
section.card h3{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.motivo{max-width:70ch;white-space:pre-wrap;word-break:break-word}
.motivo p{margin:0 0 8px}
textarea{width:100%;min-height:90px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);line-height:1.45}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.hint{font-size:12.5px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:8px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.user{align-self:flex-end;background:var(--accent-soft)}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{min-height:44px}
.instr{min-height:110px;font-family:var(--mono);font-size:13px}
.vacio{padding:40px 24px;color:var(--muted);max-width:60ch;margin:0 auto}
.vacio h2{font:700 22px var(--display);color:var(--ink)}
.nota{background:var(--ok-soft);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(560px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input,dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.vtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.vtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.vtabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d);font-weight:600}
.campo{margin:0 0 14px}
.campo h4{margin:0 0 4px;font:700 14px var(--display)}
.campo div{white-space:pre-wrap;max-width:72ch}
.revok{color:var(--ok)}
.doc{max-width:74ch}
.doc h1{font:800 26px/1.2 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.doc h2{font:700 20px/1.25 var(--display);margin:26px 0 8px}
.doc h3{font:700 16px var(--display);margin:20px 0 6px}
.doc p,.doc li{line-height:1.55}
.doc code{font:13px var(--mono);background:var(--bg);padding:1px 4px;border-radius:4px}
.doc pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto}
.doc pre code{background:none;padding:0}
.doc table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:var(--accent-soft)}
.flujo{max-width:1080px;margin:0 auto;padding:26px 24px 60px;display:flex;flex-direction:column;gap:18px}
.flujo h2{font:800 28px/1.15 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.flujo .intro{color:var(--muted);max-width:68ch;margin:0}
.lienzo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.lienzo svg{display:block;width:100%;min-width:760px;height:auto}
.nodo{cursor:pointer}
.nodo rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.nodo:hover rect,.nodo:focus rect{stroke:var(--accent);stroke-width:2.5}
.nodo:focus{outline:none}
.nodo.clave rect{fill:var(--or-soft);stroke:var(--or)}
.nodo.clave:hover rect,.nodo.clave:focus rect{stroke:var(--or-d)}
.nodo.claude rect{fill:var(--accent-soft);stroke:var(--accent)}
.nodo.estatico{cursor:default}
.nodo.estatico:hover rect{stroke:var(--line);stroke-width:1.5}
.nodo .tt{font:700 15px var(--display);fill:var(--ink)}
.nodo .st{font:12.5px var(--body);fill:var(--muted)}
.nodo .num{font:800 22px var(--display);fill:var(--ink)}
.nodo.clave .num{fill:var(--or-d)}
.nodo .ir{font:600 12px var(--body);fill:var(--accent)}
.nodo.clave .ir{fill:var(--or-d)}
.flecha{stroke:var(--muted);stroke-width:1.6;fill:none}
.nodo .ico{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nodo.clave .ico{stroke:var(--or)}
.nodo .quien-b rect{fill:var(--accent-d)!important;stroke:none!important}
.nodo .quien-b path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nodo .quien-b text{font:700 11px var(--body);fill:#fff}
:root[data-theme="dark"] .nodo .quien-b path,:root[data-theme="dark"] .nodo .quien-b text{stroke:var(--accent-ink);fill:var(--accent-ink)}
.nodo .paso-b rect{fill:var(--ink)!important;stroke:none!important}
.nodo:hover .paso-b rect,.nodo:focus .paso-b rect{stroke:none}
.paso-b circle{fill:var(--or)}
.paso-b .pn{font:800 11px var(--display);fill:#fff}
.paso-b .pl{font:700 12px var(--body);fill:var(--panel)}
.etq{font:12px var(--body);fill:var(--muted)}
.etq.lazo{fill:var(--or-d);font-weight:600}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.paso{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.paso b{font:700 15px var(--display);display:block;margin-bottom:4px}
.paso p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.ftabla{width:100%;border-collapse:collapse;font-size:14px}
.ftabla th{text-align:left;font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.ftabla td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.ftabla td b{font:700 15px var(--display)}
.ftabla .n{font:800 18px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.quien{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.quien.tu{background:var(--or-soft);color:var(--or-d)} .quien.cl{background:var(--accent-soft);color:var(--accent-d)}
.aviso{color:var(--or-d);font-weight:600}

.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.barra h2{font:800 19px/1.2 var(--display);letter-spacing:-.015em;margin:0}
body.v-w .barra{display:none}
body.v-w main, body.v-b main, body.v-f main, body.v-m main{grid-template-columns:1fr}
body.v-w #lista, body.v-b #lista, body.v-f #lista, body.v-m #lista{display:none!important}
body.v-b .counts, body.v-f .counts, body.v-m .counts{display:none}
.st-pend{background:var(--line)}
.sec{font:700 19px var(--display);margin:10px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tiles.cuatro{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tl{font-size:13px;color:var(--muted);font-weight:600}
.tn{font:800 30px/1.15 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:2px 0}
.tn small{font:500 15px var(--body);color:var(--muted)}
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.mini{width:100%;height:auto;margin-top:8px;display:block}
.mini .grid{stroke:var(--line);stroke-width:1}
.mini .ax{font:11px var(--body);fill:var(--muted)}
.mini .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.mini .ar{fill:var(--accent);opacity:.12}
.mini .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.mini .hit{fill:transparent;cursor:default}
.mini .hit:hover{fill:var(--accent);fill-opacity:.25}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}
.barras{display:flex;flex-direction:column;gap:4px}
.barra-f{display:grid;grid-template-columns:minmax(110px,38%) 1fr 48px;align-items:center;gap:10px;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left}
.barra-f:hover{background:var(--bg)}
.barra-f .be{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-f .bt{height:12px;background:var(--bg);border-radius:0 4px 4px 0}
.barra-f .bb{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.barra-f:hover .bb{background:var(--accent-d)}
.barra-f .bv{font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}

.ic{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hace{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.hace>div,.dia>div{display:flex;flex-direction:column;gap:4px}
.hace b,.dia b{font:700 15px var(--display)}
.hace span,.dia>div>span:last-child{font-size:13.5px;color:var(--muted);line-height:1.45}
.eta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px;align-items:start}
.eta .big{display:flex;gap:14px}
.eta .big .ic{width:40px;height:40px;stroke-width:1.6}
.eta .big .tn{font-size:44px}
.prog{margin:0 0 16px}
.prog .pn2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.prog .pn2 b{font:700 15px var(--display)} .prog .pn2 span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .pn2 strong{color:var(--or-d)}
.pb{display:flex;gap:2px;height:16px}
.pb .ph{background:var(--accent);border-radius:4px 0 0 4px;min-width:3px}
.pb .pp{background:var(--or-soft);border:1px solid var(--or);border-radius:0 4px 4px 0;min-width:3px}
.leyenda{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-top:6px}
.leyenda i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leyenda .lh{background:var(--accent)} .leyenda .lpd{background:var(--or-soft);border:1px solid var(--or)}
.leyenda .lr{background:var(--accent);height:3px;vertical-align:3px} .leyenda .lp{border-top:2px dashed var(--or);height:0;vertical-align:3px;border-radius:0}
.gcola{width:100%;height:auto;display:block}
.gcola .grid{stroke:var(--line);stroke-width:1} .gcola .grid.v{stroke-dasharray:2 4}
.gcola .ax{font:11.5px var(--body);fill:var(--muted)}
.gcola .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.gcola .ar{fill:var(--accent);opacity:.12}
.gcola .proy{stroke:var(--or);stroke-width:2;stroke-dasharray:6 5;fill:none}
.gcola .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.gcola .fin{fill:var(--panel);stroke:var(--or);stroke-width:2}
.gcola .etq{font:600 12.5px var(--body);fill:var(--ink)}
.gcola .fin-t{fill:var(--or-d)}
.dia{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.dia .hr{font:800 13px var(--display);color:var(--or-d);background:var(--or-soft);border-radius:999px;padding:2px 10px;align-self:flex-start}

section.card.parati{border-color:var(--or);background:var(--or-soft)}
.parati h3{color:var(--or-d)}
.parati ul,.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.parati li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--or) 25%,transparent)}
.parati li:first-child{border-top:0}
.parati li div,.plan-i div{display:flex;flex-direction:column;gap:2px}
.parati li b,.plan-i b{font:700 15px var(--display)}
.parati li span:not(.chip),.plan-i div span{font-size:13.5px;color:var(--muted)}
.plan-i{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.plan-i:first-child{border-top:0}
.plan-i .chip{justify-self:start}
.plan-i .cuando{font-size:13px;color:var(--accent-d);font-weight:600;white-space:nowrap;text-align:right;line-height:2}
.plan-i .cuando .btn{font-size:13px;padding:4px 10px}
.plan-i.hecha b{color:var(--muted)}
.plan-i .pn3{color:var(--ink)!important}

details.acord{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.acord>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px 18px}
details.acord>summary::-webkit-details-marker{display:none}
details.acord>summary:hover{background:var(--bg)}
.acs{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.acs h3{font:700 19px var(--display);margin:0}
.acst{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.kpi{display:inline-flex;align-items:baseline;gap:6px;font-size:13.5px;color:var(--muted)}
.kpi b{font:800 22px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi.av b{color:var(--or-d)} .kpi.ok b{color:var(--accent)}
.prox{font-size:13.5px;color:var(--muted)} .prox b{color:var(--ink)}
.mbar{display:flex;gap:2px;height:10px;width:100%;max-width:520px;flex-basis:100%}
.mbar span{background:var(--accent);border-radius:2px;opacity:.85}
.mbar span:nth-child(2n){opacity:.6}
.acf{font-size:18px;color:var(--muted);transition:transform .15s}
details.acord[open] .acf{transform:rotate(180deg)}
.acb{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.acb .tabwrap{border-radius:8px}
.rb{height:4px;background:var(--bg);border-radius:2px;margin-top:6px;width:70px}
.rb span{display:block;height:100%;background:var(--accent);border-radius:2px}

.item.cur{background:var(--accent-soft)}

function areaDe(d){ if(d.area&&AREAS[d.area]) return d.area; if(d.ayudaId||(d.ayudas&&d.ayudas.length)) return "datos"; if(/^fuente|fundaci|prestaci|europe|open data|bopv|recolector/i.test((d.titulo||"")+" "+(d.motivo||"").slice(0,80))) return "fuentes"; if(/dise[ñn]o|logo|pantalla|app\b|aplicaci[oó]n|icono|color/i.test(d.titulo||"")) return "eskubat"; return "datos"; }

  const T=(D.tareas||[]).filter(t=>t.quien!=="Tú"&&(!sec||(t.seccion||"fuentes")===sec)); const pend=(D.tareas||[]).filter(t=>t.quien!=="Tú"&&t.estado==="pendiente").sort((a,b)=>a.prioridad-b.prioridad);

    .sort((a,b)=>({en_curso:0,pendiente:1,bloqueada:2,hecha:3}[a.estado]-{en_curso:0,pendiente:1,bloqueada:2,hecha:3}[b.estado])||a.prioridad-b.prioridad);

  const pe=(S.peticiones||{})[t.id];

function paraTi(){
  const C=S.docs.filter(d=>(d.estado||"abierta")==="abierta").sort((a,b)=>{const da=diasHasta(a.fin),db=diasHasta(b.fin);return (da==null?999:da)-(db==null?999:db);});
  const T=(D.tareas||[]).filter(t=>t.quien==="Tú"&&t.estado!=="hecha");
  const items=[...C.map(d=>({tipo:"c",id:d._id,titulo:d.titulo,detalle:d.organismo==="Decisión de producto"||!d.ayudaId?"Decisión tuya":"Cuestión sobre una ayuda"+(d.fin?` · cierra el ${fmtFecha(d.fin)}`:"")})),
    ...T.map(t=>({tipo:"t",titulo:t.titulo,detalle:t.detalle}))];
  return `<section class="card parati"><h3>Lo que te toca a ti${items.length?` (${items.length})`:""}</h3>

}

function renderInicio(){
  const t=D.cola||{}; const c={abierta:0,lista:0}; S.docs.forEach(d=>{const e=d.estado||"abierta"; if(c[e]!=null) c[e]++;});

  };

}

const REGLAS=`Contexto: Eskubat es una app de ayudas y subvenciones de Euskadi. Sus datos están en el repositorio eskubat/datos; una tarea programada de Claude categoriza cada ayuda en 5 campos (¿Quién la convoca?, ¿En qué consiste?, ¿Cuánto puede recibir? —solo lo que recibe el solicitante—, ¿Quién puede pedirla? y Requisitos —solo condiciones del solicitante—), con una versión por tipo de solicitante (particular, autonomo, empresa, asociacion, ayuntamiento). Las cifras deben estar en la documentación oficial. Textos claros, con la ortografía corregida.`;
function contexto(d){ return `${REGLAS}\n\nCuestión:\n- Ayuda: ${d.titulo} (${d.ayudaId||"sin id"})\n- Organismo: ${d.organismo||"?"}\n- Fin de plazo: ${d.fin||"sin fecha"} (hoy es ${new Date().toISOString().slice(0,10)})\n- Motivo: ${d.motivo}\n- Instrucción actual: ${($("#instr")?.value||d.instruccion||"(ninguna)")}`; }
async function preguntar(d){
  const pin=$("#pin"), t=pin.value.trim(); if(!t||!S.sample) return;
  const chat=[...(d.chat||[]),{role:"user",content:t}]; pin.value=""; $("#psend").disabled=true;
  const box=$("#chat"); if(!(d.chat||[]).length) box.innerHTML="";
  box.insertAdjacentHTML("beforeend",`<div class="msg user">${esc(t)}</div><div class="msg assistant" id="streaming">Pensando…</div>`); box.scrollTop=box.scrollHeight;
  const msgs=[{role:"user",content:contexto(d)+"\n\nResponde en castellano, breve y concreto. Si te piden un cambio, di exactamente qué campo cambia y cómo quedaría. No inventes datos."},{role:"assistant",content:"Entendido. ¿Qué quieres aclarar?"},...chat];
  try{ const r=await S.sample(msgs,{cache:false,onText:({text})=>{const el=$("#streaming"); if(el) el.textContent=text;}}); chat.push({role:"assistant",content:r.text}); await guardar(d._id,{chat}); }
  catch(err){ const el=$("#streaming"); if(el) el.textContent=err&&err.code==="rate_limited"?"Demasiadas peticiones seguidas. Espera un minuto.":"Claude no ha podido responder ("+(err&&err.code||"error")+")."; if(err&&err.code==="not_granted") S.sample=null; $("#psend").disabled=false; }
}
async function redactar(d){
  if(!S.sample) return; const btn=$("#redactar"); btn.disabled=true; btn.textContent="Redactando…";
  const conv=(d.chat||[]).map(m=>(m.role==="user"?"Responsable: ":"Claude: ")+m.content).join("\n");
  try{ const r=await S.sample(contexto(d)+`\n\nConversación:\n${conv||"(sin conversación)"}\n\nResume en pocas frases qué ha decidido el responsable, como instrucción para la tarea programada: frases imperativas y concretas, una por línea, empezando por «- ». Solo lo decidido. Devuelve solo la instrucción.`,{cache:false,onText:({text})=>{const el=$("#instr"); if(el) el.value=text;}});
    await guardar(d._id,{instruccion:r.text.trim()}); }
  catch(err){ btn.disabled=false; btn.textContent="No se pudo; repite"; }
}
async function guardar(id,campos){
  const d=S.docs.find(x=>x._id===id); if(!d) return;
  Object.assign(d,campos,{actualizada:new Date().toISOString()});
  try{ await S.db.collection("cuestiones").doc(id).update({...campos,actualizada:d.actualizada}); setStatus("Guardado"); }
  catch(err){ setStatus(err&&err.code==="invalid_argument"?"Solo lectura: no tienes permiso para editar":"No se pudo guardar ("+(err&&err.code||"error")+")"); }
  renderLista(); if(S.sel===id) renderDetalle();
}

function sistemaAsis(){ return `Eres Claude, el asistente de la página «Eskubat — Revisión de ayudas». Eskubat es una app de ayudas y subvenciones de Euskadi. El sistema: un recolector diario lee las fuentes; Claude revisa cada hora (a y 32) las ayudas nuevas o cambiadas y redacta sus fichas; cada noche (03:17) Claude ejecuta una tarea del plan de mejora continua; cada mes revisa el plan. Las cuestiones son decisiones del responsable o cambios pedidos; las «listas» las aplica la revisión horaria en su próxima pasada (las de área eskubat, no).
Tienes herramientas para consultar los datos y para hacer cambios directamente: úsalas. Si te piden un cambio, hazlo con la herramienta adecuada y di qué has hecho y cuándo se aplicará; no pidas permiso para lo que el responsable ya ha pedido claramente, pero pregunta si algo es ambiguo o afecta a muchas ayudas sin que lo haya dicho. Antes de pedir cambios a ayudas concretas, búscalas para tener los ids. No puedes navegar por la web ni cambiar el código desde aquí: lo que exige código o fuentes nuevas va al plan (proponer_tarea_plan). Responde en castellano, breve y claro, sin jerga técnica. Hoy es ${new Date().toISOString().slice(0,10)}; los datos de la página son del ${hora(D.generado)}.`; }
function renderAsis(){
  const box=$("#asisMsgs"); if(!box) return;
  box.innerHTML=ASIS.msgs.length?ASIS.msgs.map(m=>m.role==="accion"?`<div class="msg accion">✓ ${esc(m.content)}</div>`:`<div class="msg ${m.role}">${m.role==="assistant"?linkify(m.content):esc(m.content)}</div>`).join("")
    :`<div class="asis-vacio"><p>Pídeme lo que necesites. Por ejemplo:</p>${["¿Cuánto falta para revisar todo?","Busca las ayudas de Bilbao que cierran esta semana","A las ayudas de Zaldibar añade que hay que estar empadronado","Añade al plan leer la Cámara de Comercio de Bilbao","Ejecuta ahora la tarea del BOPV","¿Qué cuestiones tengo abiertas?"].map(e=>`<button class="ej">${esc(e)}</button>`).join("")}</div>`;
  box.querySelectorAll(".ej").forEach(b=>b.onclick=()=>{ $("#asisIn").value=b.textContent; enviarAsis(); });
  box.scrollTop=box.scrollHeight;
}
async function enviarAsis(){
  const inp=$("#asisIn"), t=inp.value.trim(); if(!t||ASIS.ocupado) return;
  if(!S.sample){ ASIS.msgs.push({role:"user",content:t},{role:"assistant",content:"No tengo conexión con Claude en esta vista. Abre la página desde claude.ai con tu cuenta."}); inp.value=""; renderAsis(); return; }
  ASIS.msgs.push({role:"user",content:t}); inp.value=""; ASIS.ocupado=true; $("#asisSend").disabled=true; renderAsis();
  const box=$("#asisMsgs"); box.insertAdjacentHTML("beforeend",`<div class="msg assistant" id="asisStream">Pensando…</div>`); box.scrollTop=box.scrollHeight;
  const tools=HERR.map(hh=>({...hh,execute:async(input)=>{ const r=await hh.execute(input||{}); if(r&&r.hecho){ const L={pedir_cambio_ayudas:"Cambio pedido"+(r.ayudas?` para ${r.ayudas} ayudas`:""),decidir_cuestion:"Cuestión "+({lista:"enviada a la próxima pasada",descartada:"descartada",abierta:"reabierta"}[r.estado]||"actualizada"),crear_cuestion:"Cuestión apuntada",proponer_tarea_plan:"Idea enviada al plan",cambiar_plan:"Cambio en el plan pedido",ejecutar_tarea_ahora:"Ejecución pedida: "+(r.tarea||""),mostrar:null}[hh.name]; if(L) ASIS.msgs.push({role:"accion",content:L}); } return r; }}));
  const hist=ASIS.msgs.filter(m=>m.role!=="accion").slice(-20);
  try{
    const r=await S.sample([{role:"user",content:sistemaAsis()},{role:"assistant",content:"Entendido. ¿Qué necesitas?"},...hist],{cache:false,tools,modelTier:"default",onText:({text})=>{const el=$("#asisStream"); if(el) el.textContent=text;}});
    ASIS.msgs.push({role:"assistant",content:r.text||"Hecho."});
  }catch(err){ ASIS.msgs.push({role:"assistant",content:err&&err.code==="rate_limited"?"Demasiadas peticiones seguidas; espera un minuto.":"No he podido responder ("+(err&&err.code||"error")+")."}); }
  ASIS.ocupado=false; $("#asisSend").disabled=false; guardaAsis(); renderAsis();
}

function textoDatos(){ const m=Math.round((Date.now()-Date.parse(D.generado))/60000); return "Datos de "+(m<60?`hace ${Math.max(m,0)} min`:hora(D.generado))+" · se renuevan en cada pasada de Claude"; }
const DESDE_HASH={...Object.fromEntries(Object.entries(VISTAS).map(([k,v])=>[v,k])),"#revision":"b"};
window.addEventListener("hashchange",()=>{ const v=DESDE_HASH[location.hash]; if(v&&v!==S.vista) cambiarVista(v); });
let vIni=DESDE_HASH[location.hash]; try{ if(!vIni){ vIni=sessionStorage.getItem("eskubat-vista")||""; } sessionStorage.removeItem("eskubat-vista"); }catch{}
cambiarVista(vIni||"w"); setStatus(textoDatos());
(async()=>{
  const db=await claude.use("db");
  if(!db){ setStatus("Sin conexión con la base de datos de la página"); return; }
  S.db=db;
  const t=setTimeout(()=>setStatus("La base de datos tarda en responder"),10000);
  db.collection("cuestiones").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(t); setStatus(textoDatos()); }
    const editando=document.activeElement&&["instr","pin","pcambio"].includes(document.activeElement.id);
    S.docs=snap.docs.map(x=>({_id:x.id,...x.data()}));
    renderLista(); if(!editando) renderDetalle();
  },err=>{ clearTimeout(t); setStatus("Conexión perdida ("+err.code+"). Recarga la página."); });
  db.collection("peticiones").onSnapshot(snap=>{ S.peticiones=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()])); if(["w","f","v","b"].includes(S.vista)&&!document.activeElement?.matches?.("textarea")) renderDetalle(); },()=>{});
  try{ S.sample=await claude.use("sample"); }catch{ S.sample=null; }
  if(S.sample&&["f","c"].includes(S.vista)&&!document.activeElement?.matches?.("textarea")) renderDetalle();
})();
</script>
</body>
</html>
